<style>
    .header #settingsOpen { anchor-name: --settingsAnchor; }
    .header #settingsOptions {
        position: absolute;
        position-anchor: --settingsAnchor;
        position-area: bottom left;
        border: none;
        background-color: var(--color-surface-alt);
        backdrop-filter: blur(4px);
        transition: transform 0.3s cubic-bezier(0.911, 0.161, 0.181, 0.797);
        transform-origin: top right;
        transform: scale(0);
    }
    .header #settingsOptions.open { transform: scale(1); }

    .header #generationOpen { anchor-name: --genAnchor; }
    .header #generateOptions {
        position: absolute;
        position-anchor: --genAnchor;
        position-area: bottom right;
        border: none;
        background-color: var(--color-surface-alt);
        backdrop-filter: blur(4px);
        transition: transform 0.3s cubic-bezier(0.911, 0.161, 0.181, 0.797);
        transform-origin: top left;
        transform: scale(0);
    }
    .header #generateOptions.open { transform: scale(1); }

    @media (max-width: 768px) {
        .header .navlinks { display: none; }
    }
</style>

<header class="header p-20 row h-sb">
    <div class="left row gap-96">
        <a href="{{ url_for('app.dashboard') }}" class="link">
            <img src="{{ url_for('static', filename='assets/icons/logo.webp') }}" alt="ECHO" class="logo">
        </a>

        <div class="navlinks row gap-24">
            <button class="btn" popovertarget="generateOptions" id="generationOpen">
                <span class="text text-normal">Generate</span>
            </button>
            <a href="{{ url_for('app.editor') }}" class="link">Editor</a>
        </div>
    </div>

    <div id="generateOptions" class="rounded-16" popover>
        <div class="content column gap-8 rounded-16 p-16">
            <a href="{{ url_for('app.captions') }}" class="link row gap-8">
                <span class="symbol">subtitles</span>
                <span class="text">Captions</span>
            </a>

            <a href="{{ url_for('app.headlines') }}" class="link row gap-8">
                <span class="symbol">text_ad</span>
                <span class="text">Headlines</span>
            </a>
            
            <a href="{{ url_for('app.sticker') }}" class="link row gap-8 beta-element">
                <span class="symbol">label</span>
                <span class="text">Sticker</span>
            </a>
        </div>
    </div>

    <div class="right row gap-12">
        <a href="{{ url_for('app.dashboard') }}" class="link symbol" title="Dashboard">dashboard</a>
        <a href="{{ url_for('app.history') }}" class="link symbol" title="History">history</a>
        <a href="{{ url_for('store.store_page') }}" class="link symbol" title="Store">store</a>
        <button class="link btn symbol" title="Settings" popovertarget="settingsOptions"
            id="settingsOpen">settings</button>
        <a href="{{ url_for('billing.plans') }}" class="link symbol" title="Billing">credit_card</a>
        <button class="link btn symbol" title="Open Controls" id="openControls">page_control</button>

        <div id="settingsOptions" class="rounded-16" popover>
            <div class="content column gap-8 rounded-16 p-16">
                <button class="link btn settings-option row gap-4" id="themeControl">
                    <span class="symbol">contrast</span>
                    <span class="text">Theme</span>
                </button>

                <a href="{{ url_for('app.account') }}" class="link row settings-option row gap-4">
                    <span class="symbol">person</span>
                    <span class="text">Account</span>
                </a>

                <hr class="divider">

                <a href="{{ url_for('auth.logout') }}" class="link row settings-option row gap-4">
                    <span class="symbol">logout</span>
                    <span class="text">Logout</span>
                </a>

                <hr class="divider">

                <a href="{{ url_for('app.settings') }}" class="link row settings-option row gap-4">
                    <span class="symbol">more_horiz</span>
                    <span class="text">More</span>
                </a>
            </div>
        </div>
    </div>
</header>

<script type="module">
    const openControls = document.getElementById('openControls');
    const themeControl = document.getElementById('themeControl');
    const settingsOptions = document.getElementById('settingsOptions');
    const generateOptions = document.getElementById('generateOptions');
    const betaModeEnabled = localStorage.getItem('betaMode') === 'enabled';
    import { sendToastNotification } from '../static/js/components/toast.js';

    function toggleTheme() {
        document.body.classList.toggle('dark-theme');

        if (localStorage.getItem('theme') === 'dark') {
            localStorage.setItem('theme', 'light');
        } else {
            localStorage.setItem('theme', 'dark');
        }

        sendToastNotification('Theme toggled successfully!', 'contrast', 'var(--color-status-green)');
    }

    function setTheme() {
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-theme');
        } else { null }
    }

    function setAccent() {
        const savedAccent = localStorage.getItem('accent');
        if (!savedAccent) return;

        document.body.classList.add(savedAccent);
    }

    function setShadow() {
        const shadow = localStorage.getItem('shadow') === 'enabled';
        if (!shadow) return;

        document.body.classList.add('shadow-enabled');
    }

    function toggleBetaElements() {
        if (!betaModeEnabled) {
            document.querySelectorAll('.beta-element').forEach(element => {
                element.remove();
            });
        };
    }

    openControls.addEventListener('click', () => {
        controls.classList.add('active');
        localStorage.setItem('controls', 'visible');
    });

    settingsOptions.addEventListener('beforetoggle', () => {
        setTimeout(() => { settingsOptions.classList.toggle('open'); }, 100);
    });
    
    generateOptions.addEventListener('beforetoggle', () => {
        setTimeout(() => { generateOptions.classList.toggle('open'); }, 100);
    });

    themeControl.addEventListener('click', toggleTheme);
    document.addEventListener('DOMContentLoaded', () => {
        setTheme();
        setAccent();
        setShadow();
        toggleBetaElements();
    });
</script>
