<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="pre-connect" href="https://fonts.googleapis.com">

    <link rel="shortcut icon" href="{{ url_for('static', filename='assets/icons/favicon.ico') }}" type="image/x-icon">
    <title>Settings &bull; ECHO</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='base/_utility.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/settings.css') }}">
</head>

<body>
    {% include 'components/msg.html' %}

    {% include 'components/header.html' %}
    {% include 'components/controls.html' %}

    <main class="main">
        <section class="section p-48 flex gap-20">
            <div class="mini-nav p-20 rounded-16 bg-card column gap-4 h-fit">
                <h3 class="h3 uppercase">Controls</h3>
                <button class="link btn fl pv-12 ph-24 fs-16 rounded-12 w-full text-left" id="profileNav" data-section="profileSettings">Profile</button>
                <button class="link btn pv-12 ph-24 fs-16 rounded-12 w-full text-left" id="appearanceNav" data-section="appearanceSettings">Appearance</button>
                <button class="link btn pv-12 ph-24 fs-16 rounded-12 w-full text-left" id="aiPreferenceNav" data-section="aiPreferenceSettings">AI Preference</button>
                <button class="link btn pv-12 ph-24 fs-16 rounded-12 w-full text-left" id="securityNav" data-section="securitySettings">Security</button>
                <button class="link btn pv-12 ph-24 fs-16 rounded-12 w-full text-left" id="dataNav" data-section="dataSettings">Data</button>
            </div>

            <div class="settings-cards w-full">
                <div class="settings-card active p-20 rounded-16 bg-card column gap-20 h-fit w-full" id="profileSettings">
                    <h1 class="h1">Profile</h1>

                    <form action="/app/settings/update/profile" method="post" class="form column gap-12">
                        <div class="form-elem column gap-4">
                            <label for="name">Name</label>
                            <input required type="text" name="name" id="name" placeholder="Your name"
                                value="{{ current_user.name }}" class="input">
                        </div>

                        <div class="form-elem column gap-4">
                            <label for="email">Email</label>
                            <input required type="email" name="email" id="email" placeholder="Your email"
                                value="{{ current_user.email }}" class="input">
                        </div>

                        <div class="form-elem column gap-4">
                            <label for="site_url">Site URL</label>
                            <input required type="url" name="site_url" id="site_url" placeholder="Your site URL"
                                value="{{ current_user.site_url }}" class="input">
                        </div>

                        <button type="submit" class="btn fl rounded-full pv-12 ph-24">Update profile</button>
                    </form>
                </div>
                
                <div class="settings-card p-20 rounded-16 bg-card column gap-20 h-fit w-full" id="appearanceSettings">
                    <h1 class="h1">Appearance</h1>

                    <button class="link btn row gap-12" id="themeToggle">
                        <span class="symbol">contrast</span>
                        <span class="text">Toggle Theme</span>
                    </button>
                    
                    <button class="link btn row gap-12" popovertarget="accentsList" id="accentsBtn">
                        <span class="symbol">palette</span>
                        <span class="text">Select accent</span>
                    </button>

                    <div class="rounded-12" id="accentsList" popover>
                        <div class="content column gap-8 p-12 rounded-12">
                            <button class="btn row gap-12" id="blue">
                                <span class="sample"></span>
                                <span class="text">Blue</span>
                            </button>
                            
                            <button class="btn row gap-12" id="green">
                                <span class="sample"></span>
                                <span class="text">Green</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="{{ url_for('static', filename='js/pages/settings.js') }}"></script>
</body>

</html>
